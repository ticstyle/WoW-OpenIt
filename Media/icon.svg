<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2c114d" />
      <stop offset="70%" stop-color="#120524" />
      <stop offset="100%" stop-color="#080212" />
    </radialGradient>

    <!-- Cartoon WoW Gold Frame -->
    <linearGradient id="wowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea88" />
      <stop offset="40%" stop-color="#e6ad22" />
      <stop offset="100%" stop-color="#734900" />
    </linearGradient>

    <!-- Rich Cartoon Wood -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a35c2e" />
      <stop offset="50%" stop-color="#703917" />
      <stop offset="100%" stop-color="#3b1a06" />
    </linearGradient>

    <!-- OpenIt Magic Burst Core -->
    <radialGradient id="magicGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e5b8ff" />
      <stop offset="60%" stop-color="#9966ff" />
      <stop offset="100%" stop-color="#551a99" stop-opacity="0" />
    </radialGradient>

    <!-- Shiny Cartoon Coin Gold -->
    <linearGradient id="coinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffea66" />
      <stop offset="80%" stop-color="#d99100" />
      <stop offset="100%" stop-color="#8c5400" />
    </linearGradient>
  </defs>

  <!-- Outer WoW Action-Button Square Frame -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="url(#bgGrad)" stroke="url(#wowGold)" stroke-width="16" stroke-linejoin="round" />
  <rect x="36" y="36" width="440" height="440" rx="72" fill="none" stroke="#10041f" stroke-width="8" />

  <!-- Cartoon Energy Sunburst Background -->
  <g fill="#9966ff" opacity="0.25">
    <polygon points="256,210 210,30 256,20" />
    <polygon points="256,210 302,30 256,20" />
    <polygon points="256,210 410,80 380,50" />
    <polygon points="256,210 470,210 460,170" />
    <polygon points="256,210 102,80 132,50" />
    <polygon points="256,210 42,210 52,170" />
  </g>

  <!-- Big Magic Explosion Glow -->
  <circle cx="256" cy="200" r="160" fill="url(#magicGlow)" />

  <!-- Flying Cartoon Loot Coins -->
  <g stroke="#3b1f00" stroke-width="3">
    <!-- Left Coin -->
    <ellipse cx="140" cy="150" rx="22" ry="16" fill="url(#coinGold)" transform="rotate(-18, 140, 150)" />
    <!-- Right Coin -->
    <ellipse cx="370" cy="140" rx="24" ry="18" fill="url(#coinGold)" transform="rotate(22, 370, 140)" />
    <!-- Center Top Coin -->
    <ellipse cx="256" cy="90" rx="28" ry="20" fill="url(#coinGold)" transform="rotate(-5, 256, 90)" />
  </g>

  <!-- Chest Interior Void (Dark purple back mouth) -->
  <path d="M 120 270 C 120 220, 392 220, 392 270 L 365 390 C 365 410, 335 425, 256 425 C 177 425, 147 410, 147 390 Z" fill="#1b0633" stroke="#0e021c" stroke-width="8" stroke-linejoin="round" />

  <!-- Popping Open Lid (Angled back with cartoon curve) -->
  <g stroke="#1a0a00" stroke-width="8" stroke-linejoin="round">
    <path d="M 100 240 C 130 140, 382 140, 412 240 C 370 210, 142 210, 100 240 Z" fill="url(#woodGrad)" />
    <!-- Lid Gold Arch Trim -->
    <path d="M 100 240 C 130 140, 382 140, 412 240" fill="none" stroke="url(#wowGold)" stroke-width="12" />
    <path d="M 236 152 L 276 152 L 280 215 L 232 215 Z" fill="url(#wowGold)" />
  </g>

  <!-- Chest Body (Chunky, curved bottom) -->
  <g stroke="#1a0a00" stroke-width="8" stroke-linejoin="round">
    <!-- Main Wood Base -->
    <path d="M 115 260 L 397 260 L 372 405 C 365 425, 330 440, 256 440 C 182 440, 147 425, 140 405 Z" fill="url(#woodGrad)" />

    <!-- Left & Right Gold Corner Straps -->
    <path d="M 115 260 L 145 260 L 160 412 C 150 415, 142 408, 140 405 Z" fill="url(#wowGold)" />
    <path d="M 397 260 L 367 260 L 352 412 C 362 415, 370 408, 372 405 Z" fill="url(#wowGold)" />

    <!-- Center Lock Plate -->
    <path d="M 226 260 L 286 260 L 280 330 L 256 345 L 232 330 Z" fill="url(#wowGold)" />
  </g>

  <!-- Big Oversized Keyhole & Lock Details -->
  <circle cx="256" cy="290" r="10" fill="#1a0a00" />
  <polygon points="256,290 248,312 264,312" fill="#1a0a00" />

  <!-- Chunky Cartoon Rivets / Bolts -->
  <g fill="#ffea88" stroke="#1a0a00" stroke-width="2">
    <circle cx="132" cy="280" r="5" />
    <circle cx="144" cy="380" r="5" />
    <circle cx="380" cy="280" r="5" />
    <circle cx="368" cy="380" r="5" />
  </g>

  <!-- Cartoon Magic Sparkles & Stars -->
  <!-- Big White Center Sparkle -->
  <path d="M 256 120 L 264 145 L 289 153 L 264 161 L 256 186 L 248 161 L 223 153 L 248 145 Z" fill="#ffffff" stroke="#1a0a00" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Left Purple Star -->
  <path d="M 180 180 L 185 195 L 200 200 L 185 205 L 180 220 L 175 205 L 160 200 L 175 195 Z" fill="#ffffff" />
  
  <!-- Right Gold Star -->
  <path d="M 330 170 L 335 185 L 350 190 L 335 195 L 330 210 L 325 195 L 310 190 L 325 185 Z" fill="#ffea66" />

  <!-- Floating Energy Dots -->
  <circle cx="210" cy="120" r="6" fill="#ffffff" />
  <circle cx="310" cy="110" r="5" fill="#ffffff" />
  <circle cx="285" cy="80" r="7" fill="#ffea66" />
</svg>
